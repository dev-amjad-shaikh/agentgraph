[package]
name = "rusty-worker"
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "The durable agent runtime built in Rust — distributed worker: register Node handlers and serve them over HTTP (POST /execute)."
repository = "https://github.com/dev-amjad-shaikh/rusty"

[dependencies]
rusty-agent-runtime = { path = "../rusty-core" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
