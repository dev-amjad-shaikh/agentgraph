[package]
name = "rusty-worker"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/rusty-worker"
readme = "README.md"
description = "The durable agent runtime built in Rust — distributed worker: register Node handlers and serve them over HTTP (POST /execute)."
keywords = ["agent", "graph", "llm", "worker", "langgraph"]
categories = ["asynchronous", "network-programming"]

[dependencies]
rusty-agent-runtime = { path = "../rusty-core", version = "0.5" }
axum = "0.8"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
